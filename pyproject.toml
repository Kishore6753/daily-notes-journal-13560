[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-notes-journal"
version = "0.1.0"
description = "Daily Notes Journal - minimal backend scaffold for preview"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Daily Notes Journal Contributors" }
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "black>=24.3.0",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
]

[project.urls]
Homepage = "https://example.com"

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B","PT","RET","SIM","PL"]
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]
